<div id="vertex-widget-search" style="max-width:600px; margin:20px auto;">
  <input type="text" id="vertex-query" placeholder="Escribí lo que querés buscar..." style="width: 100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
  <button id="vertex-search-btn" style="margin-top:10px; padding:10px 20px; background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer;">Buscar</button>
  <div id="vertex-widget-results" style="margin-top:15px;"></div>
</div>

<script>
document.getElementById('vertex-search-btn').addEventListener('click', function() {
  const q = document.getElementById('vertex-query').value.trim();
  if (!q) {
    document.getElementById('vertex-widget-results').innerHTML = '<p style="color:red;">Por favor ingresá algo para buscar.</p>';
    return;
  }
  document.getElementById('vertex-widget-results').innerHTML = '<p>Cargando...</p>';
  fetch('widget_search.php?q=' + encodeURIComponent(q))
    .then(resp => resp.json())
    .then(data => {
      if (data.error) {
        document.getElementById('vertex-widget-results').innerHTML = '<p style="color:red;">'+ data.error +'</p>';
      } else if (data.results && data.results.length > 0) {
        const html = data.results.map(r => {
          return `<div style="padding:10px; border-bottom:1px solid #eee;">
                    <strong>${r.title}</strong><br>
                    <span>${r.snippet}</span>
                  </div>`;
        }).join('');
        document.getElementById('vertex-widget-results').innerHTML = html;
      } else {
        document.getElementById('vertex-widget-results').innerHTML = '<p>No se encontraron resultados.</p>';
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById('vertex-widget-results').innerHTML = '<p style="color:red;">Error al ejecutar búsqueda.</p>';
    });
});
</script>
