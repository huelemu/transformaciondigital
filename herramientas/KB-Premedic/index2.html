<div id="vertex-widget" style="max-width:600px; margin:20px auto; font-family:Arial, sans-serif;">
  <h2 style="color:green; text-align:center;">Asistente de Premedic</h2>
  <div style="display:flex; gap:5px; margin-bottom:10px;">
    <input type="text" id="vertex-query" placeholder="Escribí tu consulta..." 
           style="flex:1; padding:10px; border:1px solid #ccc; border-radius:4px;">
    <button id="vertex-search-btn" 
            style="padding:10px 20px; background:green; color:white; border:none; border-radius:4px; cursor:pointer;">
            Buscar
    </button>
  </div>
  <div id="vertex-widget-results" style="max-height:400px; overflow-y:auto;"></div>
</div>

<script>
async function doSearch() {
  const q = document.getElementById('vertex-query').value.trim();
  const resultsDiv = document.getElementById('vertex-widget-results');
  if (!q) { resultsDiv.innerHTML = '<p style="color:red;">Por favor ingresá algo para buscar.</p>'; return; }

  resultsDiv.innerHTML = '<p>Cargando...</p>';

  try {
    const resp = await fetch('widget_search.php?q=' + encodeURIComponent(q));
    const data = await resp.json();

    if (data.error) {
      resultsDiv.innerHTML = '<p style="color:red;">' + data.error + '</p>';
      return;
    }

    let html = '';
    if (data.answer && data.answer.answerText) {
      html += `<div style="padding:15px; border-radius:6px; background:#f0fff0; margin-bottom:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                 <strong>Respuesta:</strong><p>${data.answer.answerText}</p>
               </div>`;
    }

    if (data.answer && data.answer.citations && data.answer.citations.length) {
      html += '<div><strong>Fuentes:</strong>';
      data.answer.citations.forEach((c,i)=>{
        html += `<div style="padding:10px; border-radius:4px; background:#fafafa; margin-top:5px; border:1px solid #e0e0e0;">
                   ${i+1}. <strong>${c.uri || 'Fuente interna'}</strong>
                   <p style="margin:5px 0 0 0;">${c.snippet || ''}</p>
                 </div>`;
      });
      html += '</div>';
    }

    if (!html) html = '<p>No se encontraron resultados.</p>';
    resultsDiv.innerHTML = html;

  } catch(e) {
    console.error(e);
    resultsDiv.innerHTML = '<p style="color:red;">Error al ejecutar búsqueda.</p>';
  }
}

// Buscar al click
document.getElementById('vertex-search-btn').addEventListener('click', doSearch);
// Buscar al presionar Enter
document.getElementById('vertex-query').addEventListener('keypress', function(e){
  if(e.key === 'Enter') doSearch();
});
</script>
